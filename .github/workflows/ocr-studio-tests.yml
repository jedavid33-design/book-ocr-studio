name: OCR Studio Regression Checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check chapter-opening-audit.js
          node --check word-boundary-audit.js
          node --check unified-book-audit.js
          node --check ocr-first-pass.js
          node --check epub-visual-preview.js
          node --check prioritized-qa-queue.js
          node --check qa-bakeoff-core.js
          node --check qa-bakeoff-ui.js
          node --check cloudflare/openrouter-qa-relay.js
          node --check message-bubbles.js
          node --check scene-ornaments.js
      - name: Run production regression fixtures
        run: |
          node tests/reader-ready-export.test.js
          node tests/message-bubbles.test.js
          node tests/scene-ornaments.test.js
          node tests/chapter-opening-audit.test.js
          node tests/word-boundary-audit.test.js
          node tests/unified-book-audit.test.js
          node tests/ocr-first-pass.test.js
          node tests/epub-visual-preview.test.js
          node tests/prioritized-qa-queue.test.js
          node tests/qa-bakeoff.test.js
