name: OCR Studio Regression Checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check chapter-opening-audit.js
          node --check word-boundary-audit.js
          node --check message-bubbles.js
          node --check scene-ornaments.js
      - name: Run production regression fixtures
        run: |
          node tests/reader-ready-export.test.js
          node tests/message-bubbles.test.js
          node tests/scene-ornaments.test.js
          node tests/chapter-opening-audit.test.js
          node tests/word-boundary-audit.test.js
