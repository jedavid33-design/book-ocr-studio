name: Train visual italic model

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: Training epochs
        required: false
        default: "8"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r visual-model/requirements.txt

      - name: Download open font families
        run: |
          git clone --depth 1 https://github.com/google/fonts.git .training-fonts

      - name: Generate genuine Regular/Italic synthetic pairs
        run: |
          python visual-model/generate_synthetic.py \
            --fonts .training-fonts/ofl \
            --out synthetic-data \
            --per-family 80 \
            --seed 180

      - name: Train MobileNetV3-Small
        run: |
          python visual-model/train.py synthetic-data \
            --epochs ${{ inputs.epochs }} \
            --batch 64 \
            --seed 180 \
            --out italic-mobilenetv3-synthetic.pt

      - name: Export ONNX
        run: |
          python visual-model/export_onnx.py italic-mobilenetv3-synthetic.pt \
            --out italic-mobilenetv3-synthetic.onnx

      - name: Save model and synthetic manifest
        uses: actions/upload-artifact@v4
        with:
          name: italic-visual-model-synthetic
          path: |
            italic-mobilenetv3-synthetic.pt
            italic-mobilenetv3-synthetic.onnx
            synthetic-data/manifest.json
          retention-days: 30
